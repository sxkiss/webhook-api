<!DOCTYPE html>
<html lang="zh-CN" data-theme="cyber">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07090e">
  <title>MUSE OPS · 中继战术工作台</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Michroma&family=Noto+Sans+SC:wght@400;500;600;700;900&family=Syncopate:wght@700&display=swap">
  <link rel="stylesheet" href="assets/app.css?v=20261111-v10">
</head>
<body>
  <div id="boot" class="boot">
    <div class="spin"></div>
    <p>正在连接中继核心…</p>
  </div>

  <div id="app" hidden>
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 21 7 21 17 12 22 3 17 3 7"/>
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v7M21 7l-6 3.5M21 17l-6-3.5M12 22v-7M3 17l6-3.5M3 7l6 3.5"/>
          </svg>
        </div>
        <div class="brand-txt">
          <b id="brandName">MUSE OPS</b>
          <span>中继协同控制台 v2.2</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-clock">
        <svg class="sc-dial" viewBox="0 0 64 64" width="50" height="50" aria-hidden="true">
          <circle cx="32" cy="32" r="29" class="sc-ring"/>
          <circle cx="32" cy="32" r="25" class="sc-face"/>
          <g class="sc-ticks">
            <line x1="32" y1="6" x2="32" y2="11" class="major"/>
            <line x1="45" y1="9.5" x2="43.5" y2="12.2"/>
            <line x1="54.5" y1="19" x2="51.8" y2="20.5"/>
            <line x1="58" y1="32" x2="53" y2="32" class="major"/>
            <line x1="54.5" y1="45" x2="51.8" y2="43.5"/>
            <line x1="45" y1="54.5" x2="43.5" y2="51.8"/>
            <line x1="32" y1="58" x2="32" y2="53" class="major"/>
            <line x1="19" y1="54.5" x2="20.5" y2="51.8"/>
            <line x1="9.5" y1="45" x2="12.2" y2="43.5"/>
            <line x1="6" y1="32" x2="11" y2="32" class="major"/>
            <line x1="9.5" y1="19" x2="12.2" y2="20.5"/>
            <line x1="19" y1="9.5" x2="20.5" y2="12.2"/>
          </g>
          <line id="clkHour" x1="32" y1="34" x2="32" y2="17" class="sc-hand hour"/>
          <line id="clkMin" x1="32" y1="35" x2="32" y2="11" class="sc-hand min"/>
          <line id="clkSec" x1="32" y1="37" x2="32" y2="9" class="sc-hand sec"/>
          <circle cx="32" cy="32" r="2.6" class="sc-pivot"/>
        </svg>
        <div class="sc-meta">
          <span class="sc-label">系统实时时钟</span>
          <b id="sysClock">--:--:--</b>
          <span class="sc-date" id="sysDate">----/--/--</span>
        </div>
      </div>
      <div class="side-user" id="sideUser"></div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button class="iconbtn menubtn" id="menuBtn" aria-label="菜单"></button>
        <div class="topbar-titles">
          <span class="topbar-tag" id="pageTag">总览看板</span>
          <h1 id="pageTitle">总览与链路态势</h1>
          <span class="sub" id="pageSub"></span>
        </div>
        <span class="spacer"></span>
        <div class="theme-switch" id="themeSwitch" title="快捷键 T 切换主题">
          <button type="button" data-theme-opt="cyber" class="on">赛博深色</button>
          <button type="button" data-theme-opt="amber">黑金总部</button>
          <button type="button" data-theme-opt="ops">纸面工程</button>
        </div>
        <span class="live-pill" id="liveState"></span>
      </header>
      <main id="view"></main>
    </div>
  </div>

  <div id="toast" class="toast-wrap"></div>
  <div id="modal" class="modal-wrap" hidden></div>

  <script type="module" src="assets/app.js?v=20261111-merge2"></script>
</body>
</html>
